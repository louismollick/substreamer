name: Stage offline rekey fix

on:
  push:
    branches:
      - "fix/offline-rekeyed-song-duplicates"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/offline-rekeyed-song-duplicates
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/.tmp-apply-offline-rekey-fix.py')
          s = p.read_text()
          old = """topup_start = service.index(
              '  if (isTopUp) {\\n',
              service.index('export async function enqueueAlbumDownload'),
          )"""
          new = """topup_start = service.index('  if (isTopUp) {\\n    // Top-up:')"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          python scripts/.tmp-apply-offline-rekey-fix.py
      - run: npm ci
      - name: Run focused regression tests
        run: npx jest src/services/__tests__/musicCacheService.test.ts --runInBand --no-coverage
      - name: TypeScript compilation check
        run: npx tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-offline-rekey-fix.yml scripts/.tmp-apply-offline-rekey-fix.py
          git add src/services/musicCacheService.ts src/services/__tests__/musicCacheService.test.ts
          git commit -m "fix(offline): reconcile rekeyed album downloads"
          git push origin HEAD:fix/offline-rekeyed-song-duplicates
