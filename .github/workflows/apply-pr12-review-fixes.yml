name: Apply PR 12 review fixes

on:
  push:
    branches:
      - fix/parallel-download-queue-clear

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parallel-download-queue-clear

      - name: Patch queue clearing and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('src/services/musicCacheService.ts')
          source = service_path.read_text()
          old = """export async function clearDownloadQueue(): Promise<void> {
            const queue = [...musicCacheStore.getState().downloadQueue];
            await runPool(
              queue,
              async (item) => cancelDownload(item.queueId),
              { concurrency: 5 },
            );
            resumeIfSpaceAvailable();
          }
          """
          new = """export async function clearDownloadQueue(): Promise<void> {
            const queue = [...musicCacheStore.getState().downloadQueue];
            if (queue.length === 0) {
              resumeIfSpaceAvailable();
              return;
            }

            // An enqueue publishes to the mirror before its SQL batch lands. Wait for
            // every row in this snapshot first so the bulk DELETE cannot run ahead of a
            // parked insert and let that item reappear after the clear.
            await Promise.all(queue.map((item) => whenQueuePayloadWritten(item.queueId)));

            // Only the currently-downloading item can own live .tmp files: processQueue
            // runs queue items serially. Keep that cleanup, but do not read every queued
            // payload just to discover there is nothing partial on disk for it.
            const activeItem = queue.find((item) => item.status === 'downloading');
            if (activeItem) {
              try {
                await cleanupTmpFilesForQueueItem(activeItem);
              } catch {
                /* best-effort: downloadSong/reconciliation also reap tmp remnants */
              }
            }

            // queue_position is sparse by design, but new rows append after the current
            // maximum. Deleting through the snapshot maximum turns N queue-row deletes
            // into one native SQLite operation while preserving later enqueues.
            const maxQueuePosition = queue.reduce(
              (max, item) => Math.max(max, item.queuePosition),
              queue[0].queuePosition,
            );
            const snapshotIds = new Set(queue.map((item) => item.queueId));
            const db = getDb();
            let bulkDeleted = false;
            if (db) {
              try {
                await db.runAsync(
                  'DELETE FROM download_queue WHERE queue_position <= ?;',
                  [maxQueuePosition],
                );
                bulkDeleted = true;
              } catch {
                // Fall through to the existing per-item path. A failed bulk write must
                // not make the in-memory queue disappear while rows remain on disk.
              }
            }

            if (bulkDeleted) {
              musicCacheStore.setState((state) => ({
                downloadQueue: state.downloadQueue.filter(
                  (item) => !snapshotIds.has(item.queueId),
                ),
              }));
              scheduleRecalculate();
            } else {
              const result = await runPool(
                queue,
                async (item) => cancelDownload(item.queueId),
                { concurrency: 5 },
              );
              if (result.rejected.length > 0) {
                throw result.rejected[0].error;
              }
            }

            resumeIfSpaceAvailable();
          }
          """
          if old not in source:
            raise SystemExit('clearDownloadQueue block not found')
          service_path.write_text(source.replace(old, new, 1))

          test_path = Path('src/services/__tests__/musicCacheService.test.ts')
          tests = test_path.read_text()
          old_tests = """describe('clearDownloadQueue', () => {
            it('removes all items', async () => {
              musicCacheStore.setState({
                downloadQueue: [
                  {
                    queueId: 'q1', itemId: 'a1', type: 'album', name: 'X', status: 'queued',
                    totalSongs: 1, completedSongs: 0, addedAt: 1, queuePosition: 1,
                    songsJson: JSON.stringify([makeChild('t1')]),
                  },
                  {
                    queueId: 'q2', itemId: 'a2', type: 'album', name: 'X', status: 'downloading',
                    totalSongs: 1, completedSongs: 0, addedAt: 2, queuePosition: 2,
                    songsJson: JSON.stringify([makeChild('t2')]),
                  },
                ],
              } as any);
              await clearDownloadQueue();
              expect(musicCacheStore.getState().downloadQueue).toHaveLength(0);
            });
          });
          """
          new_tests = """describe('clearDownloadQueue', () => {
            it('removes all items', async () => {
              musicCacheStore.setState({
                downloadQueue: [
                  {
                    queueId: 'q1', itemId: 'a1', type: 'album', name: 'X', status: 'queued',
                    totalSongs: 1, completedSongs: 0, addedAt: 1, queuePosition: 1,
                    songsJson: JSON.stringify([makeChild('t1')]),
                  },
                  {
                    queueId: 'q2', itemId: 'a2', type: 'album', name: 'X', status: 'downloading',
                    totalSongs: 1, completedSongs: 0, addedAt: 2, queuePosition: 2,
                    songsJson: JSON.stringify([makeChild('t2')]),
                  },
                ],
              } as any);
              await clearDownloadQueue();
              expect(musicCacheStore.getState().downloadQueue).toHaveLength(0);
            });

            it('does not read every queued payload when clearing a large queue', async () => {
              const readRefs = persistenceMock.readDownloadQueueSongRefsAsync as jest.Mock;
              readRefs.mockClear();
              musicCacheStore.setState({
                downloadQueue: Array.from({ length: 100 }, (_, i) => ({
                  queueId: `bulk-q${i}`,
                  itemId: `bulk-a${i}`,
                  type: 'album',
                  name: 'X',
                  status: 'queued',
                  totalSongs: 1,
                  completedSongs: 0,
                  addedAt: i,
                  queuePosition: i + 1,
                })),
              } as any);

              await clearDownloadQueue();

              expect(readRefs).not.toHaveBeenCalled();
              expect(musicCacheStore.getState().downloadQueue).toHaveLength(0);
            });
          });
          """
          if old_tests not in tests:
            raise SystemExit('clearDownloadQueue tests block not found')
          test_path.write_text(tests.replace(old_tests, new_tests, 1))
          PY

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr12-review-fixes.yml
          git add src/services/musicCacheService.ts src/services/__tests__/musicCacheService.test.ts
          git commit -m "fix: bulk clear download queue"
          git push origin HEAD:fix/parallel-download-queue-clear
