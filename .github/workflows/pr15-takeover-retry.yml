name: PR 15 takeover retry

on:
  push:
    branches:
      - fix/offline-rekeyed-song-duplicates

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply review fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr15-takeover.yml').read_text()
          marker = "          python <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(body), 'pr15-review-fix', 'exec'))
          PY
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused music cache tests
        run: npx jest src/services/__tests__/musicCacheService.test.ts src/store/__tests__/musicCacheStore.test.ts --runInBand --no-coverage
      - name: Commit review fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/musicCacheService.ts src/store/musicCacheStore.ts src/store/persistence/musicCacheTables.ts
          git commit -m "fix(offline): keep rekey repair recoverable"
          git push origin HEAD:${GITHUB_REF_NAME}
